<svg width="700" viewBox="0 0 700 370" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Drei Verschlüsselungsebenen</title>
<desc>WireGuard, SSH-Tunnel und NordVPN schachteln sich als konzentrische Schichten um die Nutzdaten.</desc>

<!-- Layer 1: WireGuard -->
<rect x="30" y="25" width="580" height="315" rx="16" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"/>
<text x="55" y="54" font-family="monospace" font-size="13" font-weight="600" fill="#0c447c">Ebene 1 — WireGuard</text>
<text x="55" y="74" font-family="monospace" font-size="11" fill="#185fa5">Client → Gateway-Server · Port 80 / 443 (UDP)</text>

<!-- Layer 2: SSH -->
<rect x="70" y="100" width="500" height="215" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
<text x="95" y="128" font-family="monospace" font-size="13" font-weight="600" fill="#085041">Ebene 2 — SSH-Tunnel</text>
<text x="95" y="148" font-family="monospace" font-size="11" fill="#0f6e56">Gateway-Server → Standard-Server · Port 22 / 443 (TCP)</text>

<!-- Layer 3: NordVPN -->
<rect x="110" y="175" width="420" height="115" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
<text x="135" y="202" font-family="monospace" font-size="13" font-weight="600" fill="#3c3489">Ebene 3 — NordVPN</text>
<text x="135" y="222" font-family="monospace" font-size="11" fill="#534ab7">Standard-Server → Exit-Land (DE · UK · CH · ES)</text>

<!-- Core data -->
<rect x="230" y="248" width="180" height="32" rx="6" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="320" y="268" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#27500a">Nutzdaten</text>

<!-- Side labels -->
<line x1="610" y1="182" x2="640" y2="182" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="644" y="186" font-family="monospace" font-size="10" fill="#888">Ebene 1</text>

<line x1="570" y1="248" x2="640" y2="248" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="644" y="252" font-family="monospace" font-size="10" fill="#888">Ebene 2</text>

<line x1="530" y1="300" x2="640" y2="300" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="644" y="304" font-family="monospace" font-size="10" fill="#888">Ebene 3</text>

</svg>

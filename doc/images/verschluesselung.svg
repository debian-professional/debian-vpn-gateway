<svg width="700" viewBox="0 0 700 370" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Drei Verschlüsselungsebenen</title>
<desc>WireGuard (Ebene 1), SSH-Tunnel (Ebene 2) und NordVPN (Ebene 3) schachteln sich als konzentrische Schichten um die Nutzdaten.</desc>
<style>
text { font-family: ui-monospace, 'Cascadia Code', monospace, sans-serif; }
.title { font-size:13px; font-weight:600; fill:#1a1a1a; }
.sub   { font-size:11px; fill:#444; }
.label { font-size:10px; fill:#888; }
</style>

<!-- Layer 1: WireGuard -->
<rect x="30" y="25" width="580" height="315" rx="16" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"/>
<text class="title" x="55"  y="54"  dominant-baseline="central">Ebene 1 — WireGuard</text>
<text class="sub"   x="55"  y="74"  dominant-baseline="central">Client → Gateway-Server · Port 80 / 443 (UDP)</text>

<!-- Layer 2: SSH -->
<rect x="70" y="100" width="500" height="215" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
<text class="title" x="95"  y="128" dominant-baseline="central">Ebene 2 — SSH-Tunnel</text>
<text class="sub"   x="95"  y="148" dominant-baseline="central">Gateway-Server → Standard-Server · Port 22 / 443 (TCP)</text>

<!-- Layer 3: NordVPN -->
<rect x="110" y="175" width="420" height="115" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
<text class="title" x="135" y="202" dominant-baseline="central">Ebene 3 — NordVPN</text>
<text class="sub"   x="135" y="222" dominant-baseline="central">Standard-Server → Exit-Land (DE · UK · CH · ES)</text>

<!-- Core data -->
<rect x="220" y="248" width="210" height="32" rx="6" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text class="title" x="325" y="264" text-anchor="middle" dominant-baseline="central">Nutzdaten</text>

<!-- Side labels -->
<line x1="610" y1="182" x2="646" y2="182" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text class="label" x="650" y="182" dominant-baseline="central">Ebene 1</text>

<line x1="570" y1="248" x2="646" y2="248" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text class="label" x="650" y="248" dominant-baseline="central">Ebene 2</text>

<line x1="530" y1="300" x2="646" y2="300" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text class="label" x="650" y="300" dominant-baseline="central">Ebene 3</text>

</svg>

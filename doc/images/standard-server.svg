<svg width="700" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Standard-Server Architektur</title>
<desc>Verschlüsselungskette vom Client über SSH-SOCKS5-Tunnel und NordVPN bis zum Exit-Land mit DNS-Schutz via Stubby und Traffic-Obfuskation via TOR und Snowflake.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
rect { rx:8; }
text { font-family: ui-monospace, 'Cascadia Code', monospace, sans-serif; }
.title { font-size:13px; font-weight:600; fill:#1a1a1a; }
.sub   { font-size:11px; fill:#444; }
.label { font-size:10px; fill:#666; }
</style>

<!-- CLIENT -->
<rect x="18" y="168" width="132" height="90" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
<text class="title" x="84" y="205" text-anchor="middle">Client</text>
<text class="sub"   x="84" y="222" text-anchor="middle">Windows / Linux</text>
<text class="sub"   x="84" y="239" text-anchor="middle">ssh -D 1080 -N</text>

<!-- SSH ARROW -->
<line x1="150" y1="213" x2="195" y2="213" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<text class="label" x="172" y="206" text-anchor="middle">SSH</text>
<text class="label" x="172" y="228" text-anchor="middle">22 / 443</text>

<!-- SERVER CONTAINER -->
<rect x="197" y="22" width="306" height="376" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
<text class="title" x="350" y="50"  text-anchor="middle">Standard-Server</text>
<text class="sub"   x="350" y="68"  text-anchor="middle">Rechenzentrum Tschechien</text>

<!-- NordVPN -->
<rect x="217" y="86"  width="266" height="76" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
<text class="title" x="350" y="120" text-anchor="middle">NordVPN</text>
<text class="sub"   x="350" y="142" text-anchor="middle">Exit-Land frei wählbar</text>

<!-- Stubby -->
<rect x="217" y="180" width="266" height="76" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text class="title" x="350" y="213" text-anchor="middle">Stubby</text>
<text class="sub"   x="350" y="233" text-anchor="middle">DNS-over-TLS · Port 53 geblockt</text>

<!-- TOR + Snowflake -->
<rect x="217" y="274" width="266" height="76" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
<text class="title" x="350" y="307" text-anchor="middle">TOR + Snowflake</text>
<text class="sub"   x="350" y="329" text-anchor="middle">Noise-Traffic · Obfuskation</text>

<!-- ARROW server → exit -->
<line x1="503" y1="213" x2="520" y2="213" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- EXIT -->
<rect x="522" y="168" width="140" height="90" rx="10" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text class="title" x="592" y="205" text-anchor="middle">Internet</text>
<text class="sub"   x="592" y="222" text-anchor="middle">4 Länder wählbar</text>
<text class="sub"   x="592" y="239" text-anchor="middle">DE · UK · CH · ES</text>

</svg>

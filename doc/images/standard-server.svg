<svg width="700" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Standard-Server Architektur</title>
<desc>Verschlüsselungskette vom Client über SSH-SOCKS5-Tunnel und NordVPN bis zum Exit-Land.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- CLIENT -->
<rect x="18" y="168" width="132" height="90" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
<text x="84" y="205" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#1a1a1a">Client</text>
<text x="84" y="222" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">Windows / Linux</text>
<text x="84" y="239" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">ssh -D 1080 -N</text>

<!-- SSH ARROW -->
<line x1="150" y1="213" x2="195" y2="213" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="172" y="206" text-anchor="middle" font-family="monospace" font-size="10" fill="#666">SSH</text>
<text x="172" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#666">22 / 443</text>

<!-- SERVER CONTAINER -->
<rect x="197" y="22" width="306" height="376" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
<text x="350" y="50" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#1a1a1a">Standard-Server</text>
<text x="350" y="68" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">Rechenzentrum Tschechien</text>

<!-- NordVPN -->
<rect x="217" y="86" width="266" height="76" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
<text x="350" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#3c3489">NordVPN</text>
<text x="350" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">Exit-Land frei wählbar</text>

<!-- Stubby -->
<rect x="217" y="180" width="266" height="76" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="350" y="213" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#0c447c">Stubby</text>
<text x="350" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#185fa5">DNS-over-TLS · Port 53 geblockt</text>

<!-- TOR + Snowflake -->
<rect x="217" y="274" width="266" height="76" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
<text x="350" y="307" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#712b13">TOR + Snowflake</text>
<text x="350" y="329" text-anchor="middle" font-family="monospace" font-size="11" fill="#993c1d">Noise-Traffic · Obfuskation</text>

<!-- ARROW server exit -->
<line x1="503" y1="213" x2="520" y2="213" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- EXIT -->
<rect x="522" y="168" width="140" height="90" rx="10" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
<text x="592" y="205" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#27500a">Internet</text>
<text x="592" y="222" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b6d11">4 Länder wählbar</text>
<text x="592" y="239" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b6d11">DE · UK · CH · ES</text>

</svg>

<svg width="700" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gateway-Modus Architektur</title>
<desc>Client verbindet sich via WireGuard zum Gateway-Server. redsocks leitet Traffic via SSH-Tunnel zu 4 Standard-Servern mit eigenem NordVPN Exit-Land.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- CLIENT -->
<rect x="260" y="14" width="180" height="56" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
<text x="350" y="38" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#1a1a1a">Client</text>
<text x="350" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">beliebiges Gerät · WireGuard</text>

<!-- Arrow client → GW -->
<line x1="350" y1="70" x2="350" y2="93" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="372" y="85" font-family="monospace" font-size="10" fill="#666">WireGuard</text>

<!-- GW CONTAINER -->
<rect x="58" y="95" width="584" height="170" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
<text x="350" y="122" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#1a1a1a">Gateway-Server</text>
<text x="350" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">transparenter Proxy-Gateway</text>

<!-- WireGuard block -->
<rect x="78" y="153" width="150" height="60" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="153" y="179" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#0c447c">WireGuard</text>
<text x="153" y="199" text-anchor="middle" font-family="monospace" font-size="11" fill="#185fa5">Port 80 / 443</text>

<!-- Arrow WG → redsocks -->
<line x1="228" y1="183" x2="276" y2="183" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- redsocks block -->
<rect x="278" y="153" width="150" height="60" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="353" y="179" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#633806">redsocks</text>
<text x="353" y="199" text-anchor="middle" font-family="monospace" font-size="11" fill="#854f0b">TCP → SOCKS5</text>

<!-- Arrow redsocks → SSH -->
<line x1="428" y1="183" x2="476" y2="183" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- SSH block -->
<rect x="478" y="153" width="150" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
<text x="553" y="179" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#2c2c2a">SSH-Tunnel</text>
<text x="553" y="199" text-anchor="middle" font-family="monospace" font-size="11" fill="#5f5e5a">4 Verbindungen</text>

<!-- 4 arrows GW → servers -->
<line x1="138" y1="265" x2="138" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="278" y1="265" x2="278" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="422" y1="265" x2="422" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="562" y1="265" x2="562" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- 4 Standard-Servers -->
<rect x="68" y="285" width="140" height="90" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
<text x="138" y="315" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#3c3489">Server 1</text>
<text x="138" y="334" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">NordVPN</text>
<text x="138" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">Deutschland</text>

<rect x="208" y="285" width="140" height="90" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
<text x="278" y="315" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#3c3489">Server 2</text>
<text x="278" y="334" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">NordVPN</text>
<text x="278" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">United Kingdom</text>

<rect x="352" y="285" width="140" height="90" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
<text x="422" y="315" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#3c3489">Server 3</text>
<text x="422" y="334" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">NordVPN</text>
<text x="422" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">Schweiz</text>

<rect x="492" y="285" width="140" height="90" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
<text x="562" y="315" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#3c3489">Server 4</text>
<text x="562" y="334" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">NordVPN</text>
<text x="562" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#534ab7">Spanien</text>

</svg>
